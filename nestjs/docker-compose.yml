services:
  workshop-api:
    build: .
    container_name: workshop-booking-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: local_development_secret_change_later
      JWT_EXPIRES_IN: 1d
      SQLITE_DATABASE: data/workshop_booking.sqlite
    volumes:
      - workshop_sqlite_data:/app/data

volumes:
  workshop_sqlite_data:
